apis:
  identity:
    root: src/identity.yaml
  bounties:
    root: src/bounties.yaml
  submissions:
    root: src/submissions.yaml
  validations:
    root: src/validations.yaml
  rewards:
    root: src/rewards.yaml
  lineage:
    root: src/lineage.yaml
  reporting:
    root: src/reporting.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
