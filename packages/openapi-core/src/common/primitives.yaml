openapi: 3.1.0
info:
  title: Shared primitives
  version: 0.1.0
  description: Prefixed IDs and money types shared across domains.
paths: {}
components:
  schemas:
    TenantId:
      type: string
      description: Prefixed ULID-style tenant identifier.
      pattern: '^tnt_[0-9A-HJKMNP-TV-Z]{26}$'
      example: tnt_01HZYXK8J0M0W5N6P7Q8R9S0T1U2
    UserId:
      type: string
      description: Prefixed ULID-style tenant operator user identifier.
      pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
      example: usr_01HZYXK8J0M0W5N6P7Q8R9S0T1U2
    Currency:
      type: string
      description: ISO 4217 currency code.
      minLength: 3
      maxLength: 3
      pattern: '^[A-Z]{3}$'
      example: USD
    Money:
      type: object
      description: Decimal-string amount + currency (never IEEE float).
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: Signed decimal string with up to 5 fractional digits.
          pattern: '^-?\d+(\.\d{1,5})?$'
          example: "1234.56"
        currency:
          $ref: '#/components/schemas/Currency'
    JobStatus:
      type: string
      description: Generic async job lifecycle.
      enum:
        - queued
        - running
        - done
        - failed
    BountyId:
      type: string
      description: Prefixed bounty id (`bty_…`).
      pattern: '^bty_[0-9A-HJKMNP-TV-Z]{26}$'
    WorkerId:
      type: string
      description: Prefixed federated worker id (`wrk_…`).
      pattern: '^wrk_[0-9A-HJKMNP-TV-Z]{26}$'
    EnrollmentId:
      type: string
      description: Prefixed worker enrollment id (`enr_…`).
      pattern: '^enr_[0-9A-HJKMNP-TV-Z]{26}$'
    SubmissionId:
      type: string
      description: Prefixed model submission id (`sub_…`).
      pattern: '^sub_[0-9A-HJKMNP-TV-Z]{26}$'
    EvaluationId:
      type: string
      description: Prefixed holdout evaluation id (`vld_…`).
      pattern: '^vld_[0-9A-HJKMNP-TV-Z]{26}$'
    ValidationSnapshotId:
      type: string
      description: Prefixed organiser holdout snapshot id (`snp_…`).
      pattern: '^snp_[0-9A-HJKMNP-TV-Z]{26}$'
    PayoutId:
      type: string
      description: Prefixed reward payout id (`rwd_…`).
      pattern: '^rwd_[0-9A-HJKMNP-TV-Z]{26}$'
    EscrowAccountId:
      type: string
      description: Prefixed escrow account id (`esc_…`).
      pattern: '^esc_[0-9A-HJKMNP-TV-Z]{26}$'
    ModelVersionId:
      type: string
      description: Prefixed model lineage version id (`lng_…`).
      pattern: '^lng_[0-9A-HJKMNP-TV-Z]{26}$'
    DisputeId:
      type: string
      description: Prefixed scoring dispute id (`dsp_…`).
      pattern: '^dsp_[0-9A-HJKMNP-TV-Z]{26}$'
    ReportId:
      type: string
      description: Prefixed audit report id (`rpt_…`).
      pattern: '^rpt_[0-9A-HJKMNP-TV-Z]{26}$'
    ContentCid:
      type: string
      description: Content-addressed IPFS-style CID (not on-chain weight blob).
      minLength: 8
      maxLength: 128
